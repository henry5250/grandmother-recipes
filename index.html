<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granny's Recipe Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-wrapper">
    <div class="page-container">
        <header>
            <h1>Granny's Recipe Archive</h1>
            <div class="subtitle">An archive of Nancy Dawson's Recipe Index Cards</div>
            
            <div class="search-container">
                <!-- Added focus/blur JS directly to clear placeholder -->
                <input type="text" id="searchInput" 
                    placeholder="Search by name, ingredients, or notes..." 
                    onkeyup="searchRecipes()"
                    onfocus="this.placeholder = ''" 
                    onblur="this.placeholder = 'Search by name, ingredients, or notes...'">
            </div>
        </header>

        <!-- Container for horizontal scrolling -->
        <nav class="category-wrapper" id="categoryTabs"></nav>

        <main id="recipeList" class="recipe-grid"></main>
    </div>
</div>

<div id="recipeModal" class="modal">
    <!-- Inner-scroll occurs inside .modal-content -->
    <div class="modal-content">
        <button onclick="closeModal()" class="close-btn">✕</button>
        <div id="modalBody"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
