<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granny's Recipe Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-wrapper">
    <div class="page-container">
        <header>
            <h1>Granny's Recipe Archive</h1>
            <div class="subtitle">An archive of Nancy Dawson's Recipe Index Cards</div>
            
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search by name, ingredients, or notes..." onkeyup="searchRecipes()">
            </div>
        </header>

        <nav class="category-wrapper" id="categoryTabs"></nav>

        <main id="recipeList" class="recipe-grid"></main>
    </div>
</div>

<div id="recipeModal" class="modal">
    <div class="modal-content">
        <button onclick="closeModal()" style="position:absolute; right:35px; top:35px; background:none; border:none; cursor:pointer; font-size:1.5rem; opacity:0.3;">✕</button>
        <div id="modalBody"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
