<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granny's Recipe Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-container">
        <header>
            <h1>Granny's Recipe Archive</h1>
            <div class="subtitle">AN ARCHIVE OF NANCY DAWSON'S RECIPE INDEX CARDS</div>
            
            <div class="search-wrapper">
                <input type="text" id="searchInput" 
                       placeholder="Search by name, ingredients, or notes..." 
                       onkeyup="searchRecipes()"
                       onfocus="this.placeholder = ''" 
                       onblur="this.placeholder = 'Search by name, ingredients, or notes...'">
            </div>
        </header>

        <nav class="category-wrapper" id="categoryTabs"></nav>

        <main id="recipeList" class="recipe-grid"></main>
    </div>

    <!-- Hidden UI Components -->
    <div id="recipeModal" class="modal">
        <div class="modal-content">
            <button onclick="closeModal()" style="position:absolute; right:35px; top:35px; background:none; border:none; font-size:1.5rem; opacity:0.2; cursor:pointer;">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
