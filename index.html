<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Recipe Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-wrapper">
    <div class="page-container">
        <header>
            <h1>Granny's Recipe Archive</h1>
            <p class="subtitle">An archive of Nancy Dawson's Index Cards</p>
            <input type="text" id="searchInput" placeholder="Search dish, ingredients, or notes..." onkeyup="searchRecipes()">
        </header>

        <div class="category-wrapper">
            <div id="categoryTabs" class="tabs-list"></div>
        </div>

        <div id="recipeList" class="recipe-grid"></div>
    </div>
</div>

<div id="recipeModal" class="modal">
    <div class="modal-content">
        <span onclick="closeModal()" style="position:absolute; right:30px; top:25px; cursor:pointer; font-size:1.5rem;">✕</span>
        <div id="modalBody"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
